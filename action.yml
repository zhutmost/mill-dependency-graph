name: Mill Dependency Graph
description: Submit a Mill 1.1+ build's resolved JVM dependencies to the GitHub dependency graph
inputs:
  working-directory:
    description: Directory containing the Mill build
    required: false
    default: .
  token:
    description: Token with contents write permission
    required: false
    default: ${{ github.token }}
  correlator:
    description: Stable snapshot key; defaults to the workflow, job, and matrix slot
    required: false
    default: ''
  retire-correlators:
    description: Previous snapshot keys to clear, one per line
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Generate dependency graph
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.working-directory }}
        ACTION_DIR: ${{ github.action_path }}
        GRAPH_FILE: ${{ runner.temp }}/mill-dependency-graph.json
      run: |
        set -euo pipefail
        build_dir="$(cd "$BUILD_DIR" && pwd)"
        if [[ -x "$build_dir/mill" ]]; then
          mill="$build_dir/mill"
        elif [[ -x "$build_dir/millw" ]]; then
          mill="$build_dir/millw"
        else
          mill="$(command -v mill)"
        fi

        # Build the bundled plugin so the Action also works before a Maven Central release.
        (cd "$ACTION_DIR" && "$mill" --no-daemon plugin.publishLocal)
        export COURSIER_REPOSITORIES="ivy2Local|${COURSIER_REPOSITORIES:-central}"
        (cd "$build_dir" && "$mill" --no-daemon --ticker false \
          --import 'mvn:io.github.zhutmost::mill-dependency-graph::0.1.0' \
          show mill.dependencygraph.DependencyGraph/generate > "$GRAPH_FILE")
    - name: Submit dependency graph
      uses: actions/github-script@v8
      env:
        GRAPH_FILE: ${{ runner.temp }}/mill-dependency-graph.json
        MATRIX_INDEX: ${{ strategy.job-index }}
        CORRELATOR: ${{ inputs.correlator }}
        RETIRE_CORRELATORS: ${{ inputs.retire-correlators }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('node:fs')
          const { manifests } = JSON.parse(fs.readFileSync(process.env.GRAPH_FILE, 'utf8'))
          if (!manifests || Object.keys(manifests).length === 0) {
            throw new Error('The Mill build did not contain any JVM modules')
          }
          // Slot 0 keeps the original key, so switching a job to a matrix updates
          // its old snapshot instead of leaving it behind.
          const index = process.env.MATRIX_INDEX
          const matrixKey = index && index !== '0' ? `/${index}` : ''
          const correlator = process.env.CORRELATOR ||
            `${process.env.GITHUB_WORKFLOW}/${process.env.GITHUB_JOB}${matrixKey}`
          const retired = [...new Set(process.env.RETIRE_CORRELATORS.split(/\r?\n/)
            .map(key => key.trim()).filter(Boolean))]
          if (retired.includes(correlator)) {
            throw new Error(`Cannot retire the current snapshot key: ${correlator}`)
          }
          const snapshot = {
            ...context.repo,
            version: 0,
            sha: context.sha,
            ref: context.ref,
            job: {
              id: `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
              correlator
            },
            detector: {
              name: 'mill-dependency-graph',
              version: '0.1.0',
              url: 'https://github.com/zhutmost/mill-dependency-graph'
            },
            scanned: new Date().toISOString(),
            manifests
          }
          const route = 'POST /repos/{owner}/{repo}/dependency-graph/snapshots'
          await github.request(route, snapshot)
          for (const key of retired) {
            await github.request(route, {
              ...snapshot,
              job: { ...snapshot.job, correlator: key },
              manifests: { retired: { name: 'retired', resolved: {} } }
            })
          }
branding:
  icon: package
  color: blue
